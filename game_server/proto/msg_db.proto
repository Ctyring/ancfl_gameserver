syntax = "proto3";

package game_server;

// 数据库操作类型
enum DBOperationType {
    DB_OP_CREATE_ACCOUNT = 0;      // 创建账号
    DB_OP_VERIFY_ACCOUNT = 1;      // 验证账号
    DB_OP_GET_ACCOUNT_INFO = 2;    // 获取账号信息
    DB_OP_SEAL_ACCOUNT = 3;        // 封号
    DB_OP_UNSEAL_ACCOUNT = 4;      // 解封
    DB_OP_RECORD_LOGIN_LOG = 5;     // 记录登录日志
    DB_OP_CREATE_ROLE = 6;          // 创建角色
    DB_OP_UPDATE_ROLE = 7;          // 更新角色
    DB_OP_DELETE_ROLE = 8;          // 删除角色
    DB_OP_GET_ROLE_LIST = 9;        // 获取角色列表
    DB_OP_GET_ROLE_DATA = 10;       // 获取角色数据
}

// 数据库请求消息
message DBRequest {
    DBOperationType op_type = 1;    // 操作类型
    uint64 account_id = 2;          // 账号ID
    string account_name = 3;         // 账号名
    string password = 4;             // 密码
    int32 channel = 5;               // 渠道
    int32 seal_time = 6;             // 封号时间（秒）
    string version = 7;              // 版本
    string uuid = 8;                 // UUID
    string idfa = 9;                 // IDFA
    string imodel = 10;              // 设备型号
    string imei = 11;                // IMEI
    int32 ip = 12;                   // IP
    
    // 角色相关字段
    uint64 role_id = 13;             // 角色ID
    string role_name = 14;           // 角色名
    int32 server_id = 15;            // 服务器ID
    int32 career = 16;               // 职业
    int32 level = 17;                // 等级
    int64 exp = 18;                  // 经验
    int32 head_id = 19;              // 头像ID
    int32 portrait_frame = 20;       // 头像框
    int32 is_deleted = 21;            // 是否删除
    int64 delete_time = 22;          // 删除时间
}

// 数据库响应消息
message DBResponse {
    int32 ret_code = 1;              // 返回码 0:成功, 其他:失败
    string ret_msg = 2;              // 返回消息
    
    // 账号相关返回数据
    uint64 account_id = 3;           // 账号ID
    string account_name = 4;         // 账号名
    int32 channel = 5;               // 渠道
    int64 create_time = 6;           // 创建时间
    int64 last_login_time = 7;       // 最后登录时间
    int32 last_login_ip = 8;         // 最后登录IP
    bool is_sealed = 9;              // 是否被封号
    int64 seal_end_time = 10;        // 封号结束时间
    bool review = 11;                // 是否审核
    
    // 角色相关返回数据
    repeated RoleInfo role_list = 12; // 角色列表
    RoleInfo role_info = 13;         // 单个角色信息
}

// 角色信息
message RoleInfo {
    uint64 role_id = 1;              // 角色ID
    uint64 account_id = 2;           // 账号ID
    int32 server_id = 3;             // 服务器ID
    string role_name = 4;            // 角色名
    int32 career = 5;                // 职业
    int32 level = 6;                 // 等级
    int64 exp = 7;                   // 经验
    int32 head_id = 8;               // 头像ID
    int32 portrait_frame = 9;        // 头像框
    int64 create_time = 10;          // 创建时间
    int64 last_login_time = 11;      // 最后登录时间
    int32 is_deleted = 12;            // 是否删除
    int64 delete_time = 13;          // 删除时间
}
