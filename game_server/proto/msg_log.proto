syntax = "proto3";
package msg_log;

// 日志类型
enum LogType {
    LOG_TYPE_LOGIN = 0;
    LOG_TYPE_LOGOUT = 1;
    LOG_TYPE_CREATE_ROLE = 2;
    LOG_TYPE_DELETE_ROLE = 3;
    LOG_TYPE_RECHARGE = 4;
    LOG_TYPE_CONSUME = 5;
    LOG_TYPE_ITEM = 6;
    LOG_TYPE_TRADE = 7;
    LOG_TYPE_BATTLE = 8;
    LOG_TYPE_TASK = 9;
    LOG_TYPE_GUILD = 10;
    LOG_TYPE_CHAT = 11;
    LOG_TYPE_ERROR = 12;
    LOG_TYPE_SYSTEM = 13;
}

// 日志级别
enum LogLevel {
    LOG_LEVEL_DEBUG = 0;
    LOG_LEVEL_INFO = 1;
    LOG_LEVEL_WARN = 2;
    LOG_LEVEL_ERROR = 3;
    LOG_LEVEL_FATAL = 4;
}

// 单条日志记录
message LogRecord {
    int64 log_id = 1;
    LogType type = 2;
    LogLevel level = 3;
    int32 server_id = 4;
    uint64 role_id = 5;
    string role_name = 6;
    string content = 7;
    string extra_data = 8;
    int64 log_time = 9;
    string ip = 10;
}

// 发送日志请求
message SendLogReq {
    LogRecord record = 1;
}

// 发送日志响应
message SendLogAck {
    int32 result = 1;
    int64 log_id = 2;
}

// 批量发送日志请求
message SendLogBatchReq {
    repeated LogRecord records = 1;
}

// 批量发送日志响应
message SendLogBatchAck {
    int32 result = 1;
    int32 success_count = 2;
    int32 failed_count = 3;
}

// 查询日志请求
message QueryLogReq {
    LogType type = 1;
    int32 server_id = 2;
    uint64 role_id = 3;
    int64 start_time = 4;
    int64 end_time = 5;
    int32 limit = 6;
    int32 offset = 7;
}

// 查询日志响应
message QueryLogAck {
    int32 result = 1;
    repeated LogRecord records = 2;
}

// 统计日志数量请求
message CountLogReq {
    LogType type = 1;
    int32 server_id = 2;
    uint64 role_id = 3;
    int64 start_time = 4;
    int64 end_time = 5;
}

// 统计日志数量响应
message CountLogAck {
    int32 result = 1;
    int64 count = 2;
}
